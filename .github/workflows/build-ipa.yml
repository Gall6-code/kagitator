# Собирает НЕподписанный .ipa для установки через AltStore/Sideloadly
# с БЕСПЛАТНЫМ Apple ID (без Apple Developer Program за $99).
#
# .ipa нужен только ОДИН раз — дальше AltStore лишь переподписывает
# приложение каждые 7 дней на самом iPhone (без пересборки).
#
# Бесплатные минуты macOS-раннеров GitHub Actions доступны для ПУБЛИЧНЫХ
# репозиториев. В приватном репозитории нужен платный план ($4/мес,
# можно отменить сразу после одной сборки).

name: Build unsigned iOS .ipa (AltStore)

on:
  workflow_dispatch: # кнопка «Run workflow» на вкладке Actions
  push:
    branches: [main]

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Build unsigned .app
        run: |
          set -eo pipefail
          WS=$(find ios -maxdepth 1 -type d -name '*.xcworkspace' | head -1)
          test -n "$WS" || { echo "ERROR: iOS workspace not found"; exit 1; }
          echo "workspace: $WS"
          echo "=== все схемы воркспейса ==="
          xcodebuild -workspace "$WS" -list 2>/dev/null || true
          SCHEME=$(xcodebuild -workspace "$WS" -list 2>/dev/null \
            | awk '/Schemes:/{getline; gsub(/^[[:space:]]+/,"",$0); print; exit}')
          test -n "$SCHEME" || { echo "ERROR: scheme not found"; exit 1; }
          echo "scheme: $SCHEME"
          echo "=== product-настройки (TARGET_BUILD_DIR/WRAPPER_NAME) ==="
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -showBuildSettings 2>/dev/null \
            | awk '/(TARGET_BUILD_DIR|WRAPPER_NAME|PRODUCT_NAME|FULL_PRODUCT_NAME|CODE_SIGN_IDENTITY) = /{print}' | sort -u
          # CODE_SIGNING_ALLOWED=NO на Xcode 26 «успешно» завершает сборку,
          # но НЕ создаёт .app вовсе. Поэтому подписываем ad-hoc (CODE_SIGN_IDENTITY=-):
          # бандл собирается, а AltStore при установке переподпишет приложение
          # сертификатом бесплатного Apple ID.
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build
          # Если схема вдруг не включает app-таргет — собираем напрямую по таргету
          if ! find build -type d -name '*.app' 2>/dev/null | grep -q .; then
            echo "=== fallback: сборка по -target Kogitator ==="
            xcodebuild \
              -project ios/Kogitator.xcodeproj \
              -target Kogitator \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=YES \
              build
          fi
          echo "=== собранные .app ==="
          find build -type d -name '*.app' -print

      - name: Package unsigned .ipa
        run: |
          set -eo pipefail
          # Ищем .app по ВСЕМУ дереву сборки — структура Xcode 26 может отличаться
          # от классической build/Build/Products/Release-iphoneos
          APP=$(find build "$HOME/Library/Developer/Xcode/DerivedData" -type d -name '*.app' 2>/dev/null | head -1)
          echo "app: $APP"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: .app not found. Полное дерево build/:"
            find build -print 2>/dev/null | head -100
            exit 1
          fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qyr ../Cogitator-unsigned.ipa Payload)
          ls -lh Cogitator-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: cogitator-unsigned-ipa
          path: Cogitator-unsigned.ipa
          if-no-files-found: error